<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
    <linearGradient id="goldLeaf" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F5D58E" />
      <stop offset="52%" stop-color="#DFA842" />
      <stop offset="100%" stop-color="#B67B1B" />
    </linearGradient>
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D58E" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#B67B1B" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Matte Obsidian Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#obsidianBg)" />
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#goldSubtle)" stroke-width="3" />

  <!-- Outer Architectural C Arc -->
  <path
    d="M352 162 A136 136 0 1 0 352 350"
    fill="none"
    stroke="url(#goldLeaf)"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Inner Echo C Arc -->
  <path
    d="M312 204 A78 78 0 1 0 312 308"
    fill="none"
    stroke="#F5D58E"
    stroke-opacity="0.42"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Minimalist Gold Diamond Focal Mark -->
  <rect
    x="332"
    y="234"
    width="44"
    height="44"
    rx="8"
    transform="rotate(45 354 256)"
    fill="url(#goldLeaf)"
  />
</svg>
